# Publishes `hermoso-compat` to PyPI when a version tag is pushed (or by hand). PyPI Trusted Publishing (OIDC): no
# token is stored anywhere. The npm package (@hermoso/compat) is published from Hermoso's release tooling.
name: Publish Python package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag names the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $v"; exit 1; }
      - run: python -m unittest discover -s python/tests -v
      - run: python -m pip install build==1.3.0
      - run: python -m build python
      - name: Smoke test the wheel
        run: |
          python -m pip install python/dist/*.whl
          python -c "import hermoso_compat; from hermoso_compat.ayrshare import SocialPost; from hermoso_compat.zernio import Zernio; print(hermoso_compat.__version__)"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
